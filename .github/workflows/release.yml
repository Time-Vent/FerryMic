# 打版本标签（如 v0.1.0）时构建发布包并上传到 GitHub Releases（草稿，确认后手动发布）：
# - Windows：安装包 FerryMic_x.y.z_x64-setup.exe + 绿色版 FerryMic_x.y.z_windows_x64.zip
# - Linux：FerryMic_x.y.z_amd64.deb（Ubuntu / Debian）+ FerryMic_x.y.z_amd64.AppImage（其它发行版）
# On a version tag (e.g. v0.1.0), build the release packages and upload them to a draft
# GitHub Release (publish it manually after checking):
# - Windows: installer + portable zip
# - Linux: .deb (Ubuntu / Debian) + .AppImage (other distros)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 在较老的 Ubuntu 上构建，新系统也能运行（glibc 向后兼容）。
          # Build on an older Ubuntu so newer systems can run it too (glibc is backward compatible).
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 依赖 Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxdo-dev libssl-dev patchelf libfuse2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: 前端（嵌入可执行文件）Front-end (embedded into the executable)
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 打包 Bundle
        working-directory: apps/app
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}

      - name: Windows 绿色版 Portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/app/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/FerryMic.exe portable/
          Compress-Archive -Path portable/* -DestinationPath "target/release/bundle/FerryMic_${version}_windows_x64.zip"

      - name: 上传到 Release Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/*.zip
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
